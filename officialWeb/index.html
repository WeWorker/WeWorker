<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeWorker — AI 浏览器助理</title>
    <meta
      name="description"
      content="WeWorker：Adapter 驱动的开源桌面应用，让 AI 在真实浏览器中精准完成网页任务。本地运行，社区可扩展。"
    />
    <link rel="canonical" href="https://www.weworker.cc/" />
    <meta property="og:url" content="https://www.weworker.cc/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WeWorker — AI 浏览器助理" />
    <meta
      property="og:description"
      content="Adapter 驱动的开源桌面应用，让 AI 在真实浏览器中精准完成网页任务。"
    />
    <meta property="og:image" content="https://www.weworker.cc/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://www.weworker.cc/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      (() => {
        const key = 'weworker-open-theme'
        const saved = localStorage.getItem(key)
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
