name: Bug 报告
description: 报告可复现的问题，帮助我们改进 WeWorker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告。

        请勿粘贴 API Key、Token、Cookie、密码、真实账号、私人邮件、订单数据或其他敏感内容。上传日志和截图前请完成脱敏。安全漏洞请不要在这里报告，请使用 GitHub Security Advisories 或 SECURITY.md 中的私密渠道。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题
          required: true
        - label: 我已删除日志、截图和附件中的凭据及个人数据
          required: true
        - label: 这不是需要私下报告的安全漏洞
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 描述发生了什么，以及问题对你的影响
      placeholder: 清晰、简洁地描述问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 描述你预期发生的结果
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 打开……
        3. 输入……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 以下字段均可选；不确定或不适用时可留空，但请保留字段名
      value: |
        WeWorker 版本：
        安装来源：
        相关组件：
        操作系统：
        浏览器及版本：
        网站或 Adapter：

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 只粘贴定位问题所需的最小日志；请先删除凭据、账号、私人内容和本机路径
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供发生频率、最后一个正常版本或临时解决方法
