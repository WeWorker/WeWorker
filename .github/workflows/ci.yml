name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  config-check:
    name: 配置一致性检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate public configuration
        run: node scripts/check-public-config.mjs

      - name: Test public configuration validator
        run: node --test scripts/__tests__/check-public-config.test.mjs

      - name: Test build profile overlay
        run: node --test weworker/scripts/__tests__/build-profile-overlay.test.cjs

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webcli/package-lock.json
            weworker/package-lock.json
            weworker/backend-ts/package-lock.json

      - name: Install WebCLI dependencies
        working-directory: webcli
        run: npm ci

      - name: Run WebCLI tests
        working-directory: webcli
        run: npm run test:ci

      - name: Install Backend dependencies
        working-directory: weworker/backend-ts
        run: npm ci

      - name: Type-check Backend
        working-directory: weworker/backend-ts
        run: npm run typecheck

      - name: Run Backend tests
        working-directory: weworker/backend-ts
        run: npm run test:ci

      - name: Install Electron dependencies
        working-directory: weworker
        run: npm ci

      - name: Run Electron and website exploration agent integration tests
        working-directory: weworker
        run: npm run test:webwright-integration

      - name: Run Extension tests
        run: >-
          node --test
          extension/test/exploration-site-state.test.mjs
          extension/test/sidepanel-workflow-navigation.test.mjs
          extension/test/tool-route.test.mjs
          extension/test/wecli-runtime-helper.test.mjs

  build-check:
    name: 编译检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webcli/package-lock.json
            weworker/package-lock.json
            weworker/renderer/package-lock.json
            weworker/backend-ts/package-lock.json
            officialWeb/package-lock.json

      - name: Install WeWorker dependencies
        working-directory: weworker
        run: npm ci

      - name: Install Renderer dependencies
        working-directory: weworker/renderer
        run: npm ci

      - name: Install Backend dependencies
        working-directory: weworker/backend-ts
        run: npm ci

      - name: Install WebCLI dependencies
        working-directory: webcli
        run: npm ci

      - name: Install Website dependencies
        working-directory: officialWeb
        run: npm ci

      - name: Prepare desktop build configuration
        working-directory: weworker
        run: node scripts/prepare-build.cjs

      - name: Build Renderer
        working-directory: weworker
        run: npm run build:renderer

      - name: Bundle Backend TS
        working-directory: weworker
        run: npm run build:backend-ts

      - name: Bundle Bridge
        working-directory: weworker
        run: npm run build:bridge

      - name: Bundle WebCLI
        working-directory: weworker
        run: npm run build:webcli

      - name: Build Website
        working-directory: officialWeb
        run: npm run build
