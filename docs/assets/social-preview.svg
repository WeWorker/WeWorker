<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="88" y1="48" x2="1190" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111B35"/>
      <stop offset="1" stop-color="#17102D"/>
    </linearGradient>
    <linearGradient id="accent" x1="146" y1="148" x2="506" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65D6FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <circle cx="1112" cy="72" r="176" fill="#3B82F6" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="100" cy="582" r="180" fill="#8B5CF6" fill-opacity="0.16" filter="url(#glow)"/>

  <g transform="translate(96 88)">
    <clipPath id="brandLogoClip">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
    <image href="../../officialWeb/public/logo.png" width="64" height="64" preserveAspectRatio="xMidYMid slice" clip-path="url(#brandLogoClip)"/>
    <text x="84" y="48" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">WeWorker</text>
  </g>

  <text x="96" y="244" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="760">让 AI 真正操作网站</text>
  <text x="96" y="306" fill="#B8C4DC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">自然语言任务 → Adapter → 真实浏览器执行</text>

  <g transform="translate(96 356)">
    <rect width="198" height="52" rx="26" fill="#17243E" stroke="#65D6FF" stroke-opacity="0.45"/>
    <text x="99" y="34" text-anchor="middle" fill="#DDF7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">33 个网站 Adapter</text>
    <rect x="216" width="208" height="52" rx="26" fill="#17243E" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="320" y="34" text-anchor="middle" fill="#EEE7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">Windows + macOS</text>
    <rect x="442" width="170" height="52" rx="26" fill="#17243E" stroke="#A7B4CC" stroke-opacity="0.35"/>
    <text x="527" y="34" text-anchor="middle" fill="#E3E8F3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">Apache 2.0</text>
  </g>

  <g transform="translate(758 154)">
    <rect width="424" height="330" rx="22" fill="#0C1326" stroke="#90A4C8" stroke-opacity="0.3" stroke-width="2"/>
    <rect width="424" height="48" rx="22" fill="#151F36"/>
    <circle cx="24" cy="24" r="5" fill="#FB7185"/>
    <circle cx="42" cy="24" r="5" fill="#FBBF24"/>
    <circle cx="60" cy="24" r="5" fill="#34D399"/>
    <rect x="28" y="78" width="320" height="58" rx="14" fill="#1A2948"/>
    <text x="48" y="103" fill="#DDE7FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">帮我整理今天值得关注的</text>
    <text x="48" y="124" fill="#DDE7FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">GitHub 与 Hacker News 项目</text>
    <rect x="76" y="160" width="320" height="132" rx="14" fill="#16223B" stroke="#65D6FF" stroke-opacity="0.2"/>
    <text x="98" y="190" fill="#65D6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">✓ 已调用 2 个 Adapter</text>
    <text x="98" y="221" fill="#C2CEE3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">GitHub Trending：5 个项目</text>
    <text x="98" y="247" fill="#C2CEE3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Hacker News：10 条热门讨论</text>
    <text x="98" y="273" fill="#C2CEE3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">已按主题、热度和用途整理</text>
  </g>

  <text x="96" y="558" fill="#8290AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">weworker.cc</text>
  <text x="1182" y="558" text-anchor="end" fill="#8290AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">github.com/WeWorker/WeWorker</text>
</svg>
